<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Editor</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f4f2; --panel: #ffffff; --line: #d9d8d4; --fg: #1d1d1b; --muted: #6b6b66;
      --accent: #2f6fdf; --accent-soft: #2f6fdf22; --video: #5b7fd6; --visual: #8c6bd6; --audio: #3e9b7a; --danger: #c4413a;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #161615; --panel: #1f1f1e; --line: #33332f; --fg: #ecebe8; --muted: #9a9993;
        --accent: #6c9cff; --accent-soft: #6c9cff2e;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; display: grid; overflow: hidden;
           grid-template: "bar bar bar" auto "side preview props" 1fr "time time time" 260px / 240px 1fr 280px; }
    header { grid-area: bar; display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
    header h1 { font-size: 14px; margin: 0 12px 0 0; font-weight: 600; }
    header .status { margin-left: auto; color: var(--muted); max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header .status.error { color: var(--danger); }
    button, select, input { font: inherit; color: inherit; }
    button { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    aside { grid-area: side; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
    .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
    .tabs button[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); }
    .tab-body { padding: 8px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
    .tab-body .hint { color: var(--muted); font-size: 12px; }
    .media { display: flex; justify-content: space-between; gap: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
    .media:hover { border-color: var(--accent); }
    .media small { color: var(--muted); }
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
    .swatches button { width: 32px; height: 32px; padding: 0; }
    .tab-body video.camera { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; object-fit: cover; }
    .emojis { display: flex; flex-wrap: wrap; gap: 4px; font-size: 22px; }
    .emojis button { padding: 2px 6px; }
    main { grid-area: preview; display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 12px; gap: 8px; }
    .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    #preview { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; width: auto; height: 100%; background: #000; border-radius: 4px; }
    .transport { display: flex; align-items: center; gap: 10px; justify-content: center; }
    .transport .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 140px; text-align: center; }
    section.props { grid-area: props; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 10px; }
    .props h2 { font-size: 13px; margin: 4px 0 8px; }
    .props h3 { font-size: 12px; margin: 14px 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .field { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 6px; margin: 4px 0; }
    .field input[type=range] { width: 100%; }
    .field input[type=number], .field select, .field textarea, .field input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
    .props .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    footer { grid-area: time; border-top: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
    .time-bar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); }
    .time-bar label { color: var(--muted); }
    .timeline { position: relative; flex: 1; overflow: auto; user-select: none; }
    .ruler { position: sticky; top: 0; height: 22px; margin-left: 120px; border-bottom: 1px solid var(--line); background: var(--panel); z-index: 3; cursor: ew-resize; }
    .ruler span { position: absolute; top: 4px; font-size: 11px; color: var(--muted); border-left: 1px solid var(--line); padding-left: 3px; }
    .row { position: relative; height: 40px; border-bottom: 1px solid var(--line); display: flex; }
    .row.selected .head { background: var(--accent-soft); }
    .row .head { position: sticky; left: 0; width: 120px; flex: none; padding: 4px 8px; background: var(--panel); border-right: 1px solid var(--line); z-index: 2;
                 display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .row .head span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .head button { padding: 0 5px; font-size: 11px; }
    .row .lane { position: relative; flex: 1; }
    .row.audio .lane { background: color-mix(in srgb, var(--audio) 6%, transparent); }
    .item { position: absolute; top: 4px; bottom: 4px; border-radius: 5px; color: #fff; font-size: 11px; padding: 3px 8px; overflow: hidden; white-space: nowrap;
            text-overflow: ellipsis; cursor: grab; background: var(--video); border: 1px solid #0003; touch-action: none; }
    .item.visual { background: var(--visual); }
    .item.audio { background: var(--audio); }
    .item.selected { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 1; }
    .item .trim { position: absolute; top: 0; bottom: 0; width: 7px; cursor: ew-resize; }
    .item .trim.start { left: 0; } .item .trim.end { right: 0; }
    .item.selected .trim { background: #fff6; }
    .join { position: absolute; top: 12px; width: 16px; height: 16px; margin-left: -8px; transform: rotate(45deg); border-radius: 3px; padding: 0;
            background: var(--panel); border: 1px solid var(--muted); z-index: 2; }
    .join.has { background: var(--accent); border-color: var(--accent); }
    .join.selected { outline: 2px solid var(--accent); outline-offset: 2px; }
    .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); pointer-events: none; z-index: 4; }
    .drop-hint { position: fixed; inset: 0; background: var(--accent-soft); border: 3px dashed var(--accent); display: none; z-index: 10; }
    body.dropping .drop-hint { display: block; }
  </style>
</head>
<body>
  <header>
    <h1>Media Editor</h1>
    <button id="new">New</button>
    <button id="open">Open…</button>
    <button id="save">Save</button>
    <button id="add-media" class="primary">Add media…</button>
    <input id="files" type="file" multiple accept="video/mp4,audio/mp4,audio/x-m4a,image/*,.json" hidden>
    <span class="status" id="status"></span>
  </header>
  <aside>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="tab-body" id="tab-body"></div>
  </aside>
  <main>
    <div class="stage"><canvas id="preview" width="1280" height="720"></canvas></div>
    <div class="transport">
      <button id="play" aria-label="Play">▶︎ Play</button>
      <span class="time" id="time">0:00.00 / 0:00.00</span>
    </div>
  </main>
  <section class="props" id="props"></section>
  <footer>
    <div class="time-bar">
      <button id="add-video-track">+ Video track</button>
      <button id="add-audio-track">+ Audio track</button>
      <label for="zoom">Zoom</label>
      <input id="zoom" type="range" min="20" max="400" value="80">
    </div>
    <div class="timeline" id="timeline" tabindex="0"></div>
  </footer>
  <div class="drop-hint"></div>
  <script src="/build-web/mf.js"></script>
  <script type="module" src="editor.js"></script>
</body>
</html>
